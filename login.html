<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA Portal Login - Garuda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        .neural-grid {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #ea580c 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            opacity: 0.1;
            z-index: -1;
        }

        .login-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(234, 88, 12, 0.15);
        }

        .reveal {
            animation: revealUp 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes revealUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="neural-grid"></div>

    <div class="w-full max-w-md reveal">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block transition-transform hover:scale-110 duration-500">
                <img src="logo.png" alt="Garuda" class="h-20 w-20 mx-auto mb-4 object-contain">
            </a>
            <h1 class="text-3xl font-black text-gray-900 tracking-tighter uppercase">TA-Management</h1>
            <p class="text-gray-500 font-medium text-sm">Internal Administration Access</p>
        </div>

        <div class="login-glass p-10 rounded-[2.5rem]">
            <form id="loginForm" onsubmit="handleTALogin(event)" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-orange-600 ml-1">Staff ID / Email</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-badge absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="staffID" required 
                               class="w-full pl-12 pr-6 py-4 bg-white border border-gray-100 rounded-2xl focus:ring-4 focus:ring-orange-100 focus:border-orange-600 outline-none transition-all font-medium text-sm" 
                               placeholder="Email">
                    </div>
                </div>

                <div class="space-y-2">
    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-orange-600 ml-1">Secure Password</label>
        <div class="relative group">
          <div class="absolute left-5 top-1/2 -translate-y-1/2 flex items-center pointer-events-none">
            <i class="fa-solid fa-key text-gray-400 group-focus-within:text-orange-600 transition-colors duration-300"></i>
            </div>
        <input type="password" 
               id="staffPass" 
               required 
               class="w-full pl-12 pr-12 py-4 bg-white border border-gray-100 rounded-2xl 
                      focus:ring-4 focus:ring-orange-100 focus:border-orange-600 outline-none 
                      transition-all font-medium text-sm placeholder:text-gray-300" 
               placeholder="••••••••">

        <div class="absolute right-5 top-1/2 -translate-y-1/2 pointer-events-none">
            <i class="fa-solid fa-lock-hashtag text-[10px] text-gray-300 group-focus-within:text-orange-400 opacity-50 transition-all"></i>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                </div>

                <button type="submit" id="authBtn" 
                        class="w-full py-5 bg-gray-900 text-white rounded-2xl font-black uppercase tracking-[0.2em] hover:bg-orange-600 transition-all duration-500 shadow-xl shadow-orange-100 flex items-center justify-center gap-3 active:scale-95">
                    Authenticate <i class="fa-solid fa-fingerprint text-lg"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-8 space-y-4">
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-[0.3em]">
                Authorized Personnel Only
            </p>
            <a href="index.html" class="inline-flex items-center gap-2 text-gray-500 hover:text-orange-600 text-[10px] font-black uppercase tracking-widest transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Return to Homepage
            </a>
        </div>
    </div>

    <script>
        function handleTALogin(event) {
            event.preventDefault();
            
            const staffID = document.getElementById('staffID').value.trim();
            const staffPass = document.getElementById('staffPass').value;
            const btn = document.getElementById('authBtn');

            // Authorized Credentials List
            // NOTE: ID check is case-insensitive and trims spaces for convenience.
            const authorizedUsers = [
                { id: 'ta@garuda.com', pass: 'GarudaTA2026!' },
                { id: 'garudata@garuda.com', pass: 'TA2026!!' },
                { id: 'garuda-ta-01', pass: 'GarudaTA2026!' } // matches the placeholder style
            ];

            // UI Loading State
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin text-lg"></i> Verifying...';
            btn.disabled = true;

            setTimeout(() => {
                // Validate credentials (ID is case-insensitive)
                const normalizedId = staffID.toLowerCase();
                const userMatch = authorizedUsers.find(
                    user => user.id === normalizedId && user.pass === staffPass
                );

                if (userMatch) {
                    btn.classList.replace('bg-gray-900', 'bg-green-600');
                    btn.innerHTML = 'Access Granted <i class="fa-solid fa-check"></i>';
                    
                    // Smooth redirect to the dashboard
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html'; 
                    }, 800);
                } else {
                    // Error Handling
                    btn.classList.replace('bg-gray-900', 'bg-red-600');
                    btn.innerHTML = 'Access Denied <i class="fa-solid fa-xmark"></i>';
                    
                    setTimeout(() => {
                        alert('Invalid Staff ID or Password. Please contact IT if this persists.');
                        btn.classList.replace('bg-red-600', 'bg-gray-900');
                        btn.innerHTML = originalContent;
                        btn.disabled = false;
                    }, 500);
                }
            }, 1500);
        }
    </script>
</body>
</html>
