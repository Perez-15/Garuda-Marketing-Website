<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA Portal Login - Garuda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }

        .login-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        input:focus {
            outline: none;
            border-color: #ea580c;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block transition-transform hover:scale-105 duration-300">
                <img src="logo.png" alt="Garuda" class="h-20 w-20 mx-auto mb-4 object-contain">
            </a>
            <h1 class="text-3xl font-black text-gray-900 tracking-tighter uppercase">TA-Management</h1>
            <p class="text-gray-500 font-medium text-sm flex items-center justify-center gap-2">
                Internal Administration Access
            </p>
        </div>

        <div class="login-card p-10 rounded-[2rem]">
            <div id="errorMsg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl text-center font-medium"></div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-orange-600 ml-1">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-badge absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="email" id="staffEmail" required
                               class="w-full pl-12 pr-6 py-4 bg-slate-50 border border-gray-200 rounded-xl font-medium text-sm transition-colors"
                               placeholder="your@email.com">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-orange-600 ml-1">Secure Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="password" id="staffPass" required
                               class="w-full pl-12 pr-12 py-4 bg-slate-50 border border-gray-200 rounded-xl font-medium text-sm transition-colors"
                               placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="authBtn"
                        class="w-full py-5 bg-gray-900 text-white rounded-xl font-black uppercase tracking-[0.2em] hover:bg-orange-600 transition-colors shadow-lg flex items-center justify-center gap-3 active:scale-95">
                    <span id="btnText">Authenticate</span>
                    <i class="fa-solid fa-fingerprint text-lg" id="btnIcon"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-8">
            <a href="index.html" class="inline-flex items-center gap-2 text-gray-400 hover:text-orange-600 text-[10px] font-black uppercase tracking-[0.3em] transition-all">
                <i class="fa-solid fa-arrow-left"></i> Return to Homepage
            </a>
        </div>
    </div>

    <script>
        // ── Config ──────────────────────────────────────────────────────────────
        //const API_BASE = 'http://localhost:8000/api/v1';
       const API_BASE = 'https://garuda-backend-raup.onrender.com/api/v1/marketing';

        // ── Guard: redirect if already logged in ────────────────────────────────
        if (localStorage.getItem('marketing_token')) {
            window.location.replace('./admin-dashboard.html');
        }

        // ── Login Handler ───────────────────────────────────────────────────────
        async function handleLogin(event) {
            event.preventDefault();

            const email    = document.getElementById('staffEmail').value.trim();
            const password = document.getElementById('staffPass').value;
            const btn      = document.getElementById('authBtn');
            const btnText  = document.getElementById('btnText');
            const btnIcon  = document.getElementById('btnIcon');
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.add('hidden');
            btn.disabled = true;
            btnText.textContent = 'Verifying...';
            btnIcon.className = 'fa-solid fa-spinner animate-spin text-lg';

            try {
                const response = await fetch(`${API_BASE}/marketing/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Invalid credentials.');
                }

                localStorage.setItem('marketing_token', data.token);
                localStorage.setItem('marketing_user', JSON.stringify(data.user));

                btn.style.backgroundColor = '#16a34a';
                btnText.textContent = 'Access Granted';
                btnIcon.className = 'fa-solid fa-check text-lg';

                setTimeout(() => {
                    window.location.replace('./admin-dashboard.html');
                }, 800);

            } catch (err) {
                btn.style.backgroundColor = '#dc2626';
                btnText.textContent = 'Access Denied';
                btnIcon.className = 'fa-solid fa-xmark text-lg';

                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');

                document.querySelector('.login-card').animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });

                setTimeout(() => {
                    btn.style.backgroundColor = '';
                    btnText.textContent = 'Authenticate';
                    btnIcon.className = 'fa-solid fa-fingerprint text-lg';
                    btn.disabled = false;
                }, 2000);
            }
        }
    </script>
</body>
</html>
